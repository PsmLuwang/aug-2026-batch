    // Example 1 // Closure
    function bankAccount() {
      let balance = 0;

      return {
        getBalance() {
          return balance;
        },
        deposit(amount) {
          balance += amount;
        },
        withdraw(amount) {
          balance -= amount;
        }
      }
    }

    const johnsAccount = bankAccount(); 
    const maxsAccount = bankAccount(); 

    johnsAccount.deposit(1000);
    console.log(johnsAccount.getBalance());
    
    johnsAccount.withdraw(350);
    console.log(johnsAccount.getBalance());

    // max
    maxsAccount.deposit(500);
    console.log(maxsAccount.getBalance());
    
    maxsAccount.withdraw(50);
    console.log(maxsAccount.getBalance());
