  <script>

    class Account {
      #balance = 0;
      static numOfUsers = 0;
      static numOfTransactions = 0;

      constructor(name, accountNo) {
        this.name = name
        this.accountNo = accountNo
        Account.numOfUsers++;
      }

      static #isAmountValid(amount) {
        return amount >= 0;
      }

      static #isBalanceSufficient(balance, amount) {
        return balance >= amount;
      }


      deposit(amount) {
        if (Account.#isAmountValid(amount)) {
          this.#balance += amount;

          Account.numOfTransactions++;
        } else {
          console.log("Invalid amount.");
        }
      }

      getBalance() {
        // is the user verified
        console.log(`Available balance = ${this.#balance}`);
      }

      withdraw(amount) {
        if (Account.#isAmountValid(amount) && Account.#isBalanceSufficient(this.#balance, amount)) {
          this.#balance -= amount;
          Account.numOfTransactions++;
        } else {
          console.log("Invalid amount.");
        }
      }
    }
