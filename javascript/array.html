<body>
  
  <script>
  const nums = [1, 3, 4, 6, 2, 8, 11, 13, 18];

  // console.log(nums.length);
  // console.log(nums[1]);

  // console.log(nums[0]);
  // console.log(nums[1]);
  // console.log(nums[2]);
  // .....
  
  let evenCount = 0;
  let oddCount = 0;

  for (let i = 0; i < nums.length; i++) {
    if (nums[i] % 2 == 0) {
      // console.log(nums[i]);
      evenCount++
    } else {
      // console.log(nums[i] + " is odd");
      oddCount++
    }
  }

  console.log(`Even = ${evenCount}`, `Odd = ${oddCount}`);
  
  
    
  </script>
