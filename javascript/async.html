<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  

  <script>

    async function test() {
      console.log("line 1");
      console.log("line 2");
  
      // async
      await new Promise((resolve) => {
        setTimeout( async () => {
          console.log("line 3");
          resolve();
        }, 2000);
      })
  
      console.log("line 4");
      console.log("line 5");
    }

    // test();

    setTimeout(() => {
      console.log("setTimeout");
    }, 1000);
    
    setInterval(() => {
      console.log("setInterval");
    }, 2000);
    

  </script>
</body>
</html>
