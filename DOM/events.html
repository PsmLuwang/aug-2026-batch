  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

  <section id="container" class="p-5">

  </section>


  <script>
    const sampleProducts = [
      {
        id: "01",
        name: "iPhone 13 Pro",
        price: 999,
      },
      {
        id: "02",
        name: "Samsung Galaxy S21",
        price: 899,
      },
      {
        id: "03",
        name: "Google Pixel 6",
        price: 799,
      },
      {
        id: "04",
        name: "OnePlus 9 Pro",
        price: 969,
      },
      {
        id: "05",
        name: "Sony Xperia 1 III",
        price: 1199,
      }
    ]

    const container = document.getElementById("container");
    sampleProducts.forEach(product => {
      container.innerHTML += `
        <div class="border border-gray-300 p-3">
          <h1>ID: ${product.id}</h1>
          <h1>${product.name}</h1>
          <h1>$${product.price}</h1>
          <button onclick="addToCart('${product.id}')" class="bg-blue-400 active:bg-red-400 p-2">Add to cart</button>
        </div>
      `;
    });


    const cart = [];

    function addToCart(id) {
      const product = sampleProducts.find(product => product.id == id);
      cart.push(product);
      console.log(cart);
    }
