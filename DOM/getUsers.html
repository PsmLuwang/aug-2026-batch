<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
  
  <section id="display" class="p-4 grid gap-3">

  </section>

  <button onclick="loadMore()" class="bg-blue-400 p-3 text-white mx-auto block">
    Load more
  </button>


  <script>
    async function getUsers(page, limit) {

      try {
        const response = await fetch(`https://api.freeapi.app/api/v1/public/randomusers?page=${page}&limit=${limit}`);
        const data = await response.json();

        const users = data.data.data || [];
        const display = document.getElementById("display");
        users.forEach(user => {
          display.innerHTML += `
            <div class="bg-white border border-gray-300 p-4 flex gap-3 max-w-120">
              <img 
                src=${user?.picture?.large} 
                alt="profile" 
              />

              <div>
                <h1 class="font-bold">${user.name.title}. ${user.name.first} ${user.name.last}</h1>
                <p class="font-medium text-gray-600">${user.email}</p>
                <p class="text-sm text-gray-500">@${user.login.username}</p>
                
              </div>
            </div>
          `;
        });
      } catch (error) {
        console.log("error", error);
      }
      
    }

    getUsers(1, 10);

    let currentPage = 1;
    function loadMore() {
      getUsers(currentPage+1, 10);
    }
  </script>
</body>
</html>
