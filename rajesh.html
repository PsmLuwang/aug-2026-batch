    });
    const cart = [];
    const mycart = document.getElementById("myCart");
    const total = document.getElementById("total");

    function renderCart() {
      mycart.innerHTML = "";
      cart.forEach((item, index) => {
        mycart.innerHTML += `
                <div class="p-4 border border-gray-300 flex justify-between items-start gap-2">
                  <div>
                    <h1>${item.title}</h1>
                    <p>$${item.price}</p>
                  </div>
                  <button onclick="cancelItem(${index})" class="bg-red-500 text-white px-2 py-1 rounded">Cancel</button>
                </div>
              `;
      });

      const totalAmount = cart.reduce((acc, item) => acc + item.price, 0);
      total.innerHTML = `
              <p>Total Amount : $${totalAmount}</p>
              <p>Total Quantity : ${cart.length}</p>
            `;
    }

    function addToCard(id) {
      const product = products.find((product) => product.id === id);
      if (!product) return;
      cart.push(product);
      renderCart();
    }

    function cancelItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

  </script>
