<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body class="bg-gray-50">
  
  <div class="bg-white border border-gray-300 p-5 m-8 rounded-2xl shadow-lg max-w-100 space-y-5">
    <div class="relative">
      <p class="absolute left-2 top-2 bg-gray-600/60 text-white text-xs font-semibold px-3 py-1 rounded-full">New</p>
      <img 
        class="w-full aspect-square object-cover"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRP45cxYyNTW76jOrsOHmkX-59ywxkgQY7jRbIq_NAHqB6ecdwAwNV3R14&s=10" 
        alt="product" 
      />
    </div>

    <div class="space-y-2">
      <h4 class="text-gray-600 text-xs font-medium">KAAI</h4>
      <h1 class="font-semibold">Rebel bag - Gray Stage</h1>

      <div class="flex justify-between items-center">
        <h4 class="font-semibold text-lg">$129.99</h4>

        <div class="flex gap-1">
          <span class="size-4 bg-gray-500 rounded-md border border-gray-500"></span>
          <span class="size-4 bg-slate-800 rounded-md border border-slate-800"></span>
          <span class="size-4 bg-white rounded-md border border-gray-400"></span>
          <span class="size-4 bg-yellow-800 rounded-md border border-yellow-800"></span>
        </div>
      </div>

      <div class="flex gap-4 items-center">
        <div class="text-sm text-gray-500">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
        </div>

        <p class="text-sm font-medium">5 reviews</p>
      </div>

      <button class="bg-gray-500 text-white w-full h-10 rounded-full text-sm font-medium mt-5">Add to cart</button>
    </div>

  </div>

</body>
</html>
