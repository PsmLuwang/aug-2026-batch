    .box {
      background-color: red;
      height: 60px;
      width: 60px;

      font-size: 32px;

      display: flex;
      justify-content: center;
      align-items: center;
    }
    .parent {
      height: 500px;
      background-color: rgb(192, 192, 192);
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      /* gap: 2px; */
    }
  </style>
